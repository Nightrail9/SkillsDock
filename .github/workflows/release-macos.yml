name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 读取版本号（以 src-tauri/tauri.conf.json 为准）
        id: version
        working-directory: .
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 构建 dmg / app.tar.gz
        working-directory: src-tauri
        run: npx tauri build --bundles dmg,app --target ${{ matrix.target }}

      - name: 打包 .app 为 app.tar.gz（供进阶用户直接解压使用）
        working-directory: src-tauri
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
          esac
          tar -czf "SkillDock-${APP_VERSION}-${ARCH}.app.tar.gz" -C "target/${{ matrix.target }}/release/bundle/macos" SkillDock.app
          ls -la "SkillDock-${APP_VERSION}-${ARCH}.app.tar.gz"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: skilldock-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/SkillDock-${{ steps.version.outputs.version }}-*.app.tar.gz
          if-no-files-found: error
