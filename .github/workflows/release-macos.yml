name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target || 'windows-x86_64' }})
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json on the draft release.
      # Serializing the matrix prevents concurrent writes from dropping platforms.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: ''
            args: --bundles nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and upload signed release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: SkillDock v__VERSION__
          releaseBody: Windows setup/portable files and macOS x64/arm64 disk images.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $binary = Join-Path $PWD 'src-tauri/target/release/skilldock.exe'
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected portable executable was not produced: $binary"
          }
          $staging = Join-Path $env:RUNNER_TEMP 'skilldock-green'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $staging 'SkillDock.exe')
          Set-Content -LiteralPath (Join-Path $staging 'skilldock-portable.flag') -Value 'true' -NoNewline
          $archive = Join-Path $PWD "SkillDock-$version-x64-green.zip"
          Compress-Archive -LiteralPath (Join-Path $staging 'SkillDock.exe'), (Join-Path $staging 'skilldock-portable.flag') -DestinationPath $archive -Force
          gh release upload "v$version" $archive --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
