name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target || 'windows-x86_64' }})
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json on the draft release.
      # Serializing the matrix prevents concurrent writes from dropping platforms.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: ''
            args: --bundles nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and upload signed release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: SkillDock v__VERSION__
          releaseBody: Windows setup/portable files and macOS x64/arm64 disk images.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $binary = Join-Path $PWD 'src-tauri/target/release/skilldock.exe'
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected portable executable was not produced: $binary"
          }
          $staging = Join-Path $env:RUNNER_TEMP 'skilldock-green'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $staging 'SkillDock.exe')
          Set-Content -LiteralPath (Join-Path $staging 'skilldock-portable.flag') -Value 'true' -NoNewline
          $archive = Join-Path $PWD "SkillDock-$version-x64-green.zip"
          Compress-Archive -LiteralPath (Join-Path $staging 'SkillDock.exe'), (Join-Path $staging 'skilldock-portable.flag') -DestinationPath $archive -Force
          gh release upload "v$version" $archive --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite updater asset URLs as public download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node -e '
            const fs = require("node:fs");
            const { spawnSync } = require("node:child_process");
            const releasePath = `${process.env.RUNNER_TEMP}/releases.json`;
            const releases = JSON.parse(fs.readFileSync(releasePath, "utf8"));
            const release = releases.find((item) => item.tag_name === process.env.RELEASE_TAG && item.draft);
            if (!release) {
              throw new Error(`Draft release ${process.env.RELEASE_TAG} was not found`);
            }

            const manifestAsset = release.assets.find((asset) => asset.name === "latest.json");
            if (!manifestAsset) {
              throw new Error(`Draft release ${process.env.RELEASE_TAG} has no latest.json asset`);
            }
            const downloaded = spawnSync(
              "gh",
              ["api", "-H", "Accept: application/octet-stream", `repos/${process.env.GITHUB_REPOSITORY}/releases/assets/${manifestAsset.id}`],
              { encoding: "utf8", env: process.env, maxBuffer: 16 * 1024 * 1024 },
            );
            if (downloaded.status !== 0) {
              throw new Error(`Could not download latest.json: ${downloaded.stderr}`);
            }
            const manifest = JSON.parse(downloaded.stdout);
            const assetsById = new Map(release.assets.map((asset) => [String(asset.id), asset]));
            let rewritten = 0;

            for (const platform of Object.values(manifest.platforms ?? {})) {
              const match = platform.url.match(/\/releases\/assets\/(\d+)(?:$|\?)/);
              if (!match) continue;

              const asset = assetsById.get(match[1]);
              if (!asset?.browser_download_url) {
                throw new Error(`Release asset ${match[1]} has no public download URL`);
              }
              platform.url = asset.browser_download_url.replace(
                /\/download\/untagged-[^/]+\//,
                `/download/${process.env.RELEASE_TAG}/`,
              );
              rewritten += 1;
            }

            if (rewritten === 0) {
              throw new Error("No GitHub API asset URLs found in latest.json");
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/latest.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
