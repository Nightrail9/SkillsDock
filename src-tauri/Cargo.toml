[package]
name = "skilldock"
version = "0.3.1"
description = "SkillDock - AI skill management desktop application"
authors = ["SkillDock"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "skilldock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
dirs = "5.0"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
zip = "2.2"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
